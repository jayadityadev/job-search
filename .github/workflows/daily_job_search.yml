name: Daily Autonomous Job Search & Briefing

on:
  schedule:
    # 01:00 UTC = 06:30 AM IST every morning
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not dispatch email)'
        required: false
        default: 'false'
        type: boolean
      limit:
        description: 'Number of jobs to discover'
        required: false
        default: '10'
        type: string

jobs:
  job-search:
    name: Run Autonomous Job Skill
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install LaTeX for PDF Resume Compilation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended

      - name: Execute Job Search Skill Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          
          LIMIT_VAL="${{ inputs.limit }}"
          if [ -z "$LIMIT_VAL" ]; then
            LIMIT_VAL="10"
          fi

          uv run --with ddgs --with beautifulsoup4 --with openpyxl --with python-docx python scripts/run_skill.py $DRY_RUN_FLAG --limit $LIMIT_VAL

      - name: Upload Run Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-job-runs
          path: runs/
          retention-days: 14
